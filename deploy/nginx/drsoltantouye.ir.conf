# nginx in front of the Docker stack, plain HTTP on port 80.
# HTTPS is terminated at the CDN, which connects to this server over HTTP.
# Install: copy to /etc/nginx/conf.d/, then  nginx -t && systemctl reload nginx
# The web container listens on 127.0.0.1:8010; it proxies /backend to the API itself.
# Do not add an http -> https redirect here: the CDN reaches the origin over http and would loop.

upstream clinic_web {
    server 127.0.0.1:8010;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Visitor IP as the CDN reports it (first entry of X-Forwarded-For); used for rate limits.
# Allow port 80 only from the CDN's address ranges so this header cannot be forged.
map $http_x_forwarded_for $visitor_ip {
    ~^(?<first_ip>[^,\s]+)  $first_ip;
    default                 $remote_addr;
}

# The public site is always https, whatever scheme the CDN uses towards the origin.
map $http_x_forwarded_proto $public_proto {
    ""      https;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.drsoltantouye.ir;
    return 301 https://drsoltantouye.ir$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name drsoltantouye.ir;

    add_header X-Content-Type-Options "nosniff" always;

    # gallery uploads go up to 25 MB
    client_max_body_size 30m;

    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://clinic_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $visitor_ip;
        proxy_set_header X-Forwarded-For $visitor_ip;
        proxy_set_header X-Forwarded-Proto $public_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
